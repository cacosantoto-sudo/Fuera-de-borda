<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fuera de Borda">
<link rel="apple-touch-icon" href="icono-180.png">
<title>Fuera de Borda</title>
<meta name="theme-color" content="#1f72e6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:ital,wght@1,700;1,800;1,900&family=Barlow:ital,wght@0,400;0,500;0,700;1,400;1,800&display=swap">
<style>
/* ESTILO "CAMIÓN AZUL DE LOS 90" (vista previa 13/11/2026, según foto que mandó Juan): cabina azul, franjas roja, blanca y violeta, chapas negras con letra blanca y cromados; títulos Saira itálica, texto Barlow.
   MODO EMERGENCIA: letra grande, un paso por pantalla, botones grandes abajo,
   naranja/rojo SOLO para emergencia y verde para "funcionó". Todos los colores salen de estas variables. */
:root{
  --bg:#ffffff; --surface:#ffffff; --soft:#e7f0fc; --line:#a9c4ea;
  --ink:#0d1b33; --muted:#3d4f6b;
  --sos:#ff5a10; --sos-ink:#ffffff; --sos-soft:#ffe1d4;
  --ok:#1f8a3a; --ok-ink:#ffffff; --ok-soft:#dcf2e0;
  --warn:#8a5a00; --warn-soft:#fff3c4;
  --azul:#1667d9; --cabina:#1f72e6; --rojo:#e3174c; --violeta:#5b3a9e; --placa:#14161a;
  --cromo:linear-gradient(#ffffff,#c9d3dc 45%,#8e9aa6 55%,#e8edf2);
  --raya:linear-gradient(transparent 0 20%,#e3174c 20% 40%,#ffffff 40% 60%,#5b3a9e 60% 80%,transparent 80%);
  --font:"Barlow",Verdana,system-ui,sans-serif;
  --display:"Saira","Barlow",Arial,sans-serif;
  --r:0px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08111f; --surface:#101c30; --soft:#16264a; --line:#2c4470;
  --ink:#eef4ff; --muted:#b4c4e0;
  --sos:#ff6a33; --sos-ink:#ffffff; --sos-soft:#4a1a0c;
  --ok:#3fbf63; --ok-ink:#06200e; --ok-soft:#10301a;
  --warn:#ffd24a; --warn-soft:#3d3010;
  --azul:#5b9bff; --cabina:#1a5fc4; --rojo:#ff3d6b; --violeta:#9a7bff; --placa:#000000;
  --cromo:linear-gradient(#5a6672,#2a333c 50%,#46525e);
  --raya:linear-gradient(transparent 0 20%,#ff3d6b 20% 40%,#ffffff 40% 60%,#9a7bff 60% 80%,transparent 80%);
  --font:"Barlow",Verdana,system-ui,sans-serif;
  --display:"Saira","Barlow",Arial,sans-serif;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08111f; --surface:#101c30; --soft:#16264a; --line:#2c4470;
  --ink:#eef4ff; --muted:#b4c4e0;
  --sos:#ff6a33; --sos-ink:#ffffff; --sos-soft:#4a1a0c;
  --ok:#3fbf63; --ok-ink:#06200e; --ok-soft:#10301a;
  --warn:#ffd24a; --warn-soft:#3d3010;
  --azul:#5b9bff; --cabina:#1a5fc4; --rojo:#ff3d6b; --violeta:#9a7bff; --placa:#000000;
  --cromo:linear-gradient(#5a6672,#2a333c 50%,#46525e);
  --raya:linear-gradient(transparent 0 20%,#ff3d6b 20% 40%,#ffffff 40% 60%,#9a7bff 60% 80%,transparent 80%);
  --font:"Barlow",Verdana,system-ui,sans-serif;
  --display:"Saira","Barlow",Arial,sans-serif;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 104px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:560px;margin:0 auto}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.12;font-weight:700}
h1{font-size:1.7rem} h2{font-size:1.4rem} h3{font-size:1.1rem}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:4px solid var(--sos);outline-offset:2px}
.eyebrow{font-size:.85rem;font-weight:700;color:var(--muted)}
.mono{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}

/* Barra de arriba: motor a la izquierda, botón de ayuda siempre a la derecha */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px;display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:2px solid var(--ink);margin-bottom:18px}
.top .motor{min-width:0;text-decoration:none;line-height:1.2}
.top .motor small{display:block;font-size:.8rem;color:var(--muted)}
.top .motor b{display:block;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ayuda-btn{flex-shrink:0;display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;font-weight:700;font-size:1rem;text-decoration:none;min-height:48px}
.ayuda-btn svg{width:20px;height:20px}

/* Pestañas de abajo */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:2px solid var(--ink);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px 12px;text-decoration:none;color:var(--muted);font-weight:700;font-size:.9rem;position:relative;min-height:64px}
.tabs a svg{width:26px;height:26px}
.tabs a[aria-current="page"]{color:var(--ink)}
.tabs a[aria-current="page"]::before{content:"";position:absolute;top:0;left:20%;right:20%;height:5px;background:var(--ink);border-radius:0 0 4px 4px}
.badge{position:absolute;top:6px;left:calc(50% + 8px);background:var(--sos);color:var(--sos-ink);border-radius:999px;font-size:.75rem;min-width:22px;padding:0 6px;line-height:22px;text-align:center}

/* Botones */
.btn{display:block;border:0;border-radius:var(--r);padding:16px 18px;font-weight:700;font-size:1.1rem;cursor:pointer;background:var(--ink);color:var(--bg);text-align:center;text-decoration:none;min-height:56px}
.btn.sec{background:var(--soft);color:var(--ink);border:2px solid var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.ok{background:var(--ok);color:var(--ok-ink)}
.btn.sos{background:var(--sos);color:var(--sos-ink)}
.btn.full{width:100%}
.btn:disabled{opacity:.5}
.btn.big{font-size:1.3rem;padding:20px 18px;min-height:68px}
.link{background:none;border:0;padding:10px;color:var(--muted);text-decoration:underline;text-underline-offset:4px;font-size:1rem;cursor:pointer;text-align:center}
.volver{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;background:none;border:2px solid var(--ink);border-radius:12px;padding:8px 16px;font-weight:700;font-size:1.05rem;cursor:pointer;min-height:48px}

/* Bloques */
.panel{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:16px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 12px;font-size:.85rem;font-weight:700;white-space:nowrap}
.chip.simple,.chip.aldia{background:var(--ok-soft);color:var(--ok)}
.chip.intermedio,.chip.proxima,.chip.sinregistro{background:var(--warn-soft);color:var(--warn)}
.chip.mecanico,.chip.vencida{background:var(--sos);color:var(--sos-ink)}
.chip.uso,.chip.info{background:var(--soft);color:var(--ink)}
.notice{border-radius:var(--r);padding:14px 16px;font-size:1rem;display:flex;flex-direction:column;gap:6px}
.notice.alto{background:var(--sos-soft);color:var(--ink);border:3px solid var(--sos)}
.notice.info{background:var(--soft);border:2px solid var(--line)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:1rem}
.field input,.field select,.field textarea{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:13px 14px;width:100%;min-height:52px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--ink);border-radius:12px;overflow:hidden}
.seg input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;margin:0}
.seg label{padding:13px 10px;text-align:center;cursor:pointer;font-weight:700;background:var(--surface)}
.seg input:checked+label{background:var(--ink);color:var(--bg)}
.seg input:focus-visible+label{outline:4px solid var(--sos);outline-offset:-4px}
.section-title{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:10px}

/* Inicio */
.sos-card{display:flex;flex-direction:column;justify-content:flex-end;gap:6px;min-height:230px;background:var(--sos);color:var(--sos-ink);border-radius:20px;padding:22px 20px;text-decoration:none;position:relative}
.sos-card svg{position:absolute;top:20px;left:20px;width:52px;height:52px}
.sos-card b{font-size:2rem;line-height:1.05}
.sos-card span{font-size:1.05rem}
.accesos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.accesos a{display:flex;flex-direction:column;justify-content:flex-end;min-height:104px;border:2px solid var(--ink);border-radius:var(--r);padding:14px;text-decoration:none;font-weight:700;font-size:1.15rem;position:relative}
.accesos a small{font-weight:400;font-size:.88rem;color:var(--muted)}
.accesos a.alerta{border-color:var(--sos);box-shadow:inset 0 0 0 2px var(--sos)}
.accesos a.alerta small{color:var(--ink);font-weight:700}
.consejo{display:flex;gap:12px;align-items:flex-start;background:var(--soft);border-radius:var(--r);padding:14px;font-size:1rem}
.consejo i{flex-shrink:0;width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);font-style:normal;font-weight:700;display:grid;place-items:center}

/* Seguridad primero */
.seguro{border:3px solid var(--sos);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.seguro h2{font-size:1.2rem}
ol.pasos-num{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:n}
ol.pasos-num li{display:flex;gap:12px;align-items:flex-start;counter-increment:n;font-size:1.08rem}
ol.pasos-num li::before{content:counter(n);flex-shrink:0;width:32px;height:32px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-weight:700;font-size:1rem}

/* Mosaicos de síntomas */
.mosaico{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sintoma{display:flex;flex-direction:column;justify-content:space-between;gap:10px;min-height:132px;text-align:left;background:var(--surface);border:2px solid var(--ink);border-radius:var(--r);padding:14px 12px;cursor:pointer}
.sintoma svg{width:40px;height:40px}
.sintoma b{font-size:1.1rem;line-height:1.15}
.sintoma .apague{display:inline-block;margin-top:4px;background:var(--sos);color:var(--sos-ink);border-radius:6px;padding:1px 8px;font-size:.78rem;font-weight:700}
.sintoma.urgente{border-color:var(--sos);box-shadow:inset 0 0 0 2px var(--sos)}
.sintoma.urgente svg{color:var(--sos)}
.sintoma:active{background:var(--soft)}

/* Paso a paso */
.ladder{display:flex;gap:6px}
.ladder span{flex:1;height:12px;border-radius:6px;background:var(--line)}
.ladder span.done,.ladder span.now{background:var(--ink)}
.ladder span.now{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--ink)}
.ladder span.mec{background:repeating-linear-gradient(-45deg,var(--sos) 0 4px,var(--sos-soft) 4px 8px)}
.paso h1{font-size:1.85rem}
.paso ol.pasos-num li{font-size:1.15rem}
.respuestas{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.respuestas p{text-align:center;font-weight:700;color:var(--muted)}

/* Fin: resuelto y "pida ayuda" */
.bien{background:var(--ok-soft);border:3px solid var(--ok);border-radius:var(--r);padding:18px 16px;display:flex;flex-direction:column;gap:10px}
.bien .eyebrow{color:var(--ok)}
.stop{background:var(--sos);color:var(--sos-ink);border-radius:var(--r);padding:20px 16px;display:flex;flex-direction:column;gap:6px}
.stop .eyebrow{color:var(--sos-ink)}
.stop h1{font-size:1.9rem}
.llamar{display:flex;justify-content:space-between;align-items:center;gap:10px;border:2px solid var(--ink);border-radius:var(--r);padding:12px 14px;text-decoration:none;min-height:72px}
.llamar small{display:block;color:var(--muted);font-size:.88rem}
.llamar b{font-size:1.5rem;font-variant-numeric:tabular-nums}
.llamar span.accion{background:var(--ink);color:var(--bg);border-radius:10px;padding:8px 14px;font-weight:700;flex-shrink:0}
.llamar.pendiente{border-style:dashed;border-color:var(--line)}
.llamar.pendiente b{font-size:1.1rem}
details.tecnico{border:2px solid var(--line);border-radius:var(--r);padding:12px 14px}
details.tecnico summary{font-weight:700;cursor:pointer;min-height:32px}
details.tecnico ul{margin:10px 0 0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.resumen{white-space:pre-wrap;font-size:.92rem;background:var(--soft);border-radius:12px;padding:12px;border:2px dashed var(--line);overflow-x:auto}

/* Mantenimiento */
.tarea{background:var(--surface);border:2px solid var(--line);border-radius:var(--r)}
.tarea>button{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;width:100%;background:none;border:0;padding:16px;text-align:left;cursor:pointer}
.tarea>button .t{min-width:0;flex:1}
.tarea>button .t small{color:var(--muted);display:block;font-size:.95rem;margin-top:2px}
.tarea .det{padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px;border-top:2px solid var(--line)}
.tarea .det ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:8px}
.sumario{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sumario div{border:2px solid var(--line);border-radius:var(--r);padding:12px 8px;text-align:center}
.sumario b{display:block;font-size:2.2rem;line-height:1}
.sumario .v{border-color:var(--sos)} .sumario .v b{color:var(--sos)}
.sumario .p b{color:var(--warn)} .sumario .a b{color:var(--ok)}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hist li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);align-items:baseline;font-size:1rem}
.hist li:last-child{border-bottom:0}
table.datos{width:100%;border-collapse:collapse;font-size:1rem}
table.datos td{padding:10px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.datos td:last-child{text-align:right;font-weight:700;padding-left:10px}
.pend{color:var(--warn)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;z-index:20;font-weight:700;max-width:90%}
@media (prefers-reduced-motion:no-preference){.view{animation:in .18s ease-out}@keyframes in{from{transform:translateY(6px)}to{transform:none}}}
/* Instalar la app: banda arriba + hoja con pasos (iPhone o navegador sin instalación directa) */
.inst{display:flex;align-items:center;gap:10px;margin:12px 0 0;padding:10px;border:2px solid var(--ok);border-radius:var(--r);background:var(--ok-soft)}
.inst[hidden],.inst-hoja[hidden]{display:none}
.inst .inst-si{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:12px;background:var(--ok);color:var(--ok-ink);font-weight:700;font-size:1.1rem;min-height:56px;padding:10px 14px;cursor:pointer}
.inst .inst-si svg{width:26px;height:26px;flex-shrink:0}
.inst .inst-no{border:0;background:none;color:var(--muted);font-size:.95rem;min-height:56px;padding:0 6px;cursor:pointer;text-decoration:underline}
.inst-hoja{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.inst-hoja .caja{box-sizing:border-box;background:var(--surface);color:var(--ink);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
.inst-hoja h2{margin:0 0 14px;font-size:1.35rem}
.inst-hoja ol{margin:0 0 18px;padding:0;list-style:none;counter-reset:p}
.inst-hoja li{counter-increment:p;min-width:0;display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);font-size:1.1rem}
.inst-hoja li::before{content:counter(p);flex-shrink:0;width:36px;height:36px;border-radius:50%;background:var(--ok);color:var(--ok-ink);font-weight:700;display:grid;place-items:center}
.inst-hoja .ico{display:inline-flex;vertical-align:middle;border:2px solid var(--ink);border-radius:8px;padding:2px 6px;margin:0 2px}
.inst-hoja .ico svg{width:20px;height:20px}
.inst-hoja li span{min-width:0;flex:1}
.inst-hoja .flecha{margin:0 0 14px;color:var(--muted);font-size:1rem}

/* ---------- Estilo camión azul de los 90 (sobrescribe lo anterior) ---------- */
h1,h2{font-family:var(--display);font-weight:900;font-style:italic;text-transform:uppercase;letter-spacing:-.01em;line-height:1}
h1{font-size:1.75rem}
h3{font-weight:700}
.top{border-bottom:0;padding-bottom:22px}
.top::after{content:"";position:absolute;left:-16px;right:-16px;bottom:0;height:14px;background:var(--raya);clip-path:polygon(0 0,100% 0,100% 100%,22% 100%)}
.top .motor b{font-family:var(--display);font-weight:800;font-style:italic;text-transform:uppercase;font-size:1.1rem}
.ayuda-btn{background:var(--sos);color:var(--sos-ink);border-radius:0;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);padding-inline:20px}
.tabs{border-top:0}
.tabs::before{content:"";position:absolute;left:0;right:0;top:-10px;height:10px;background:var(--raya)}
.tabs a[aria-current="page"]{color:var(--azul)}
.tabs a[aria-current="page"]::before{display:none}
.btn{border-radius:0;clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%);font-weight:800;font-style:italic;text-transform:uppercase;letter-spacing:.02em;padding-inline:28px}
.btn.sec,.btn.ghost{background:var(--soft);border:0;box-shadow:inset 0 -5px 0 var(--ink)}
.btn.big{font-family:var(--display);font-weight:900;font-size:1.4rem}
.volver{border-radius:0;border-width:3px;font-style:italic}
.panel,.tarea,.notice.info{border:0;border-left:8px solid var(--azul);border-radius:0;background:var(--soft)}
.tarea .det{border-top:2px solid var(--line)}
.field label{font-family:var(--display);font-weight:800;font-style:italic;text-transform:uppercase;font-size:.85rem;color:var(--azul)}
.field input,.field select,.field textarea{border:0;border-bottom:4px solid var(--ink);border-radius:0;background:var(--surface);font-size:1.1rem}
.seg{border:0;gap:10px;overflow:visible}
.seg label{border:0;border-radius:0;background:var(--surface);box-shadow:inset 0 0 0 3px var(--ink);clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);font-weight:800;font-style:italic;font-size:1.1rem}
.seg input:checked+label{background:var(--azul);color:#fff;box-shadow:none}
.sos-card{border-radius:0;overflow:hidden;padding-top:84px;min-height:250px;clip-path:polygon(0 0,100% 0,100% calc(100% - 26px),calc(100% - 26px) 100%,0 100%)}
.sos-card::after{content:"";position:absolute;left:0;right:0;top:34px;height:46px;background:linear-gradient(#e3174c 0 30%,#fff 30% 62%,#5b3a9e 62%);clip-path:polygon(30% 0,100% 0,100% 100%,40% 100%);opacity:.95}
.sos-card b{font-family:var(--display);font-weight:900;font-style:italic;text-transform:uppercase;font-size:2.1rem;position:relative;z-index:1}
.sos-card span{position:relative;z-index:1}
.accesos a{border:0;border-radius:0;background:var(--soft);border-bottom:6px solid var(--azul);font-family:var(--display);font-weight:800;font-style:italic;text-transform:uppercase;font-size:1.2rem;position:relative;overflow:hidden}
.accesos a::after{content:"";position:absolute;top:12px;right:-6px;width:60%;height:24px;background:var(--raya);clip-path:polygon(18% 0,100% 0,100% 100%,0 100%)}
.accesos a small{font-family:var(--font);font-style:normal;text-transform:none;font-weight:500}
.consejo{border-radius:0;background:var(--soft);border-left:8px solid var(--amarillo)}
.consejo i{background:var(--amarillo);color:#111318}
.seguro{border-radius:0}
.sintoma{border:0;border-radius:0;background:var(--soft);border-bottom:5px solid var(--ink)}
.sintoma b{font-weight:700}
.sintoma.urgente{border-bottom-color:var(--sos);box-shadow:none}
.sintoma .apague{border-radius:0;font-style:italic}
.ladder span{border-radius:0!important}
.ladder span.done,.ladder span.now{background:var(--azul)}
.ladder span.now{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--azul)}
.bien,.stop{border-radius:0}
.stop{clip-path:polygon(0 0,100% 0,100% calc(100% - 22px),calc(100% - 22px) 100%,0 100%)}
.llamar{border:0;border-radius:0;background:var(--soft);border-left:8px solid var(--sos)}
.llamar span.accion{border-radius:0;background:var(--sos);color:#fff;font-style:italic;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);padding-inline:18px}
details.tecnico{border-radius:0}
.sumario div{border:0;border-radius:0;background:var(--soft);border-bottom:5px solid var(--azul)}

.toast{border-radius:0}
.inst{border:0;border-left:8px solid var(--ok);border-radius:0}

.top{background:var(--cabina);color:#fff;box-shadow:0 0 0 100vmax var(--cabina);clip-path:inset(0 -100vmax)}

body::before{background:var(--cabina)}
.top::after{height:16px;bottom:4px}

.panel,.tarea,.notice.info{border-left-color:var(--cabina)}

<div class="app">
<div class="inst" id="inst" hidden>

    <h2 id="inst-tit">Instalar en 3 pasos</h2>

  </div>
</div>

<script src="datos-motores.js"></script>
<script src="diagnosticos.js"></script>
<script src="identificar-anio.js"></script>
<script>
(function(){
"use strict";
const D = window.DATOS;
const KEY = "fdb-scotto-v1";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hoy = () => new Date().toISOString().slice(0,10);
const fmtFecha = f => { try { return new Date(f+"T12:00:00").toLocaleDateString("es-AR",{day:"numeric",month:"short",year:"numeric"}); } catch(e){ return f; } };
const mesesEntre = (a,b) => (new Date(b) - new Date(a)) / (1000*60*60*24*30.44);

/* ---------- Estado guardado en el celular ---------- */
let S = load();
function load(){ try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.motor){ if (s.motor.catalogoId === "ejemplo-yamaha-40-2t"){ s.motor.catalogoId = "yamaha-40-2t"; s.motor.modelo = "40 HP 2T"; } if (s.motor.catalogoId === "mercury-40c-2t-jp"){ s.motor.catalogoId = "mercury-40-2t-jp"; s.motor.modelo = "40 HP 2T japonés"; } return s; } } catch(e){} return { motor:null, horas:0, registros:[] }; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
let diag = null;        // diagnóstico en curso
let abierta = null;     // tarea desplegada
let registrando = null; // tarea en registro

/* ---------- Contenido según el motor ---------- */
function ficha(){
  const m = S.motor; if (!m) return null;
  const x = D.MOTORES.find(x => x.id === m.catalogoId); if (!x) return null;
  const fam = (x.familia && D.FAMILIAS && D.FAMILIAS[x.familia]) || {};
  const hermanos = x.familia ? D.MOTORES.filter(o => o.familia === x.familia && o.id !== x.id && o.marca === x.marca).map(o => o.marca+" "+o.modelo) : [];
  return Object.assign({}, x, {
    estado: x.familia && fam.estado ? fam.estado : x.estado,
    fuente: x.fuente || fam.fuente,
    datosTecnicos: x.datosTecnicos || fam.datosTecnicos || [],
    consejos: (fam.consejos || []).concat(x.consejos || []),
    ajustes: Object.assign({}, fam.ajustes, x.ajustes),
    tareasExtra: (fam.tareasExtra || []).concat(x.tareasExtra || []),
    diagnosticosExtra: (fam.diagnosticosExtra || []).concat(x.diagnosticosExtra || []),
    hermanos
  });
}
function aplica(x){
  const m = S.motor;
  if (x.tiempos && x.tiempos !== m.tiempos) return false;
  if (x.alimentacion && x.alimentacion !== m.alimentacion) return false;
  return true;
}
function tareas(){
  const f = ficha(), aj = (f && f.ajustes) || {};
  const extra = (f && f.tareasExtra) || [];
  return D.MANTENIMIENTO_BASE.concat(extra).filter(aplica).map(t => aj[t.id] ? Object.assign({}, t, aj[t.id]) : t).filter(t => !t.noAplica)
    .map(t => S.motor.uso === "trabajo" && t.cadaTrabajo ? Object.assign({}, t, { cada: Object.assign({}, t.cada, t.cadaTrabajo) }) : t);
}
function diagnosticos(){
  const f = ficha(), extra = (f && f.diagnosticosExtra) || [];
  return D.DIAGNOSTICOS_BASE.concat(extra).filter(aplica).map(d => Object.assign({}, d, { pasos: d.pasos.filter(aplica) }));
}
function ultimo(id){ return S.registros.filter(r => r.tarea === id).sort((a,b)=> b.fecha.localeCompare(a.fecha) || (b.horas||0)-(a.horas||0))[0]; }
function estado(t){
  if (t.cada && t.cada.usos) return { k:"uso", txt:"Después de cada uso" };
  const u = ultimo(t.id);
  if (t.temporada){
    if (u && mesesEntre(u.fecha, hoy()) < 10) return { k:"aldia", txt:"Hecha el "+fmtFecha(u.fecha) };
    return { k:"sinregistro", txt: t.temporada === "inicio" ? "Al poner en marcha la lancha" : "Al guardar la lancha" };
  }
  const c = t.cada;
  const txtCada = (c.horas ? "cada "+c.horas+" h" : "") + (c.horas && c.meses ? " o " : "") + (c.meses ? "cada "+c.meses+" meses" : "");
  if (!u){
    const lim = c.primeraHoras || c.horas;
    if (!lim || S.horas >= lim) return { k:"sinregistro", txt:"Sin registro · "+txtCada };
    return { k:"proxima", txt: c.primeraHoras ? "Motor 0 horas: primera a las "+lim+" h" : "Primera a las "+lim+" h" };
  }
  const faltanH = c.horas ? (u.horas + c.horas) - S.horas : Infinity;
  const faltanM = c.meses ? c.meses - mesesEntre(u.fecha, hoy()) : Infinity;
  if (faltanH <= 0 || faltanM <= 0) return { k:"vencida", txt: faltanH <= 0 ? "Vencida por "+Math.abs(Math.round(faltanH))+" h" : "Vencida por tiempo" };
  if (faltanH <= 10 || faltanM <= 1) return { k:"proxima", txt: faltanH <= 10 ? "Faltan "+Math.round(faltanH)+" h" : "Vence este mes" };
  const partes = [];
  if (isFinite(faltanH)) partes.push("Faltan "+Math.round(faltanH)+" h");
  if (isFinite(faltanM)) partes.push((partes.length ? "o " : "Faltan ")+Math.max(1,Math.round(faltanM))+" meses");
  return { k:"aldia", txt: partes.join(" ") };
}
const nombreEstado = { vencida:"Vencida", proxima:"Próxima", aldia:"Al día", sinregistro:"Revisar", uso:"Cada uso" };
function pendientes(){ return tareas().filter(t => ["vencida"].includes(estado(t).k)).length; }

/* ---------- Datos del taller (completar con el teléfono real) ---------- */
// tel: número para llamar, con código de área, sin espacios (ej.: "+5491112345678").
// whatsapp: el mismo número sin "+" (ej.: "5491112345678"). Si quedan vacíos, la app lo indica.
const TALLER = { nombre:"Scotto Mecánica Náutica", tel:"+5493425217781", whatsapp:"5493425217781", ver:"342 521-7781" };
const PREFECTURA = { nombre:"Prefectura Naval · emergencias", tel:"106", radio:"canal 16" };

/* ---------- Pedir turno al taller ---------- */
function textoTurno(lista){
  const m = S.motor || {};
  return `Hola, quiero pedir turno en el taller para el service de mi motor.
Motor: ${[m.marca, m.modelo, (m.modelo||"").includes(m.tiempos||"-") ? "" : m.tiempos, m.anio ? "año "+m.anio : ""].filter(Boolean).join(" ")}
Horas de uso: ${Math.round(S.horas)}
Lo que le toca:
${lista.map(t => "- "+t.nombre+" ("+estado(t).txt+")").join("\n")}
(Pedido desde la app Fuera de Borda)`;
}

/* ---------- Estadísticas anónimas ---------- */
// Cuentan, SIN datos personales, cuánta gente usa la app, qué motores tienen, qué fallas consultan
// y cuántas veces llaman o piden turno al taller. No se envía nombre, teléfono, ubicación ni historial.
// Servicio: GoatCounter (gratuito, sin cookies). Para activarlo, crear una cuenta en goatcounter.com
// y poner acá el código elegido (ej.: "scotto-fdb"). Mientras quede vacío, la app no envía nada.
// Si no hay señal (en el agua), los conteos esperan en el celular y se mandan cuando vuelve.
const ESTADISTICAS = { goatcounter: "" };
const KEY_EST = KEY + "-est", KEY_COLA = KEY + "-cola";
function estPermitidas(){ try { return localStorage.getItem(KEY_EST) !== "no"; } catch(e){ return true; } }
function estActivas(){ return !!ESTADISTICAS.goatcounter && estPermitidas(); }
function modoApp(){ try { return (matchMedia("(display-mode: standalone)").matches || navigator.standalone) ? "instalada" : "navegador"; } catch(e){ return "navegador"; } }
function leerCola(){ try { return JSON.parse(localStorage.getItem(KEY_COLA)) || []; } catch(e){ return []; } }
function contar(evento){
  if (!estActivas()) return;
  const cola = leerCola().concat([String(evento).slice(0,120)]).slice(-60);
  try { localStorage.setItem(KEY_COLA, JSON.stringify(cola)); } catch(e){}
  enviarCola();
}
function enviarCola(){
  if (!estActivas() || navigator.onLine === false) return;
  const cola = leerCola(); if (!cola.length) return;
  try { localStorage.removeItem(KEY_COLA); } catch(e){}
  const base = "https://" + encodeURIComponent(ESTADISTICAS.goatcounter) + ".goatcounter.com/count?e=true";
  cola.forEach(ev => { const img = new Image(); img.src = base + "&p=" + encodeURIComponent(ev) + "&rnd=" + Math.random().toString(36).slice(2); });
}
window.addEventListener("online", enviarCola);
window.addEventListener("appinstalled", () => contar("instalacion"));
// Clics que interesa contar (se registran antes de que cambie la pantalla)
document.addEventListener("click", ev => {
  const el = ev.target.closest('a[href^="tel:"], [data-ev], [data-a="sintoma"], [data-a="resuelto"]'); if (!el) return;
  if (el.dataset.ev) contar(el.dataset.ev);
  else if (el.dataset.a === "sintoma") contar("sintoma/" + el.dataset.id);
  else if (el.dataset.a === "resuelto" && diag) contar("diag-resuelto/" + diag.id + "/paso-" + (diag.paso+1));
  else contar(el.getAttribute("href") === "tel:" + PREFECTURA.tel ? "llamar/prefectura" : "llamar/taller");
}, true);
document.addEventListener("change", ev => {
  if (ev.target.id !== "est-ok") return;
  try { if (ev.target.checked) localStorage.removeItem(KEY_EST); else { localStorage.setItem(KEY_EST, "no"); localStorage.removeItem(KEY_COLA); } } catch(e){}
  toast(ev.target.checked ? "Gracias por ayudar" : "Listo, no se cuenta nada");
});

/* ---------- Dibujos ---------- */
const svg = (p, vb) => `<svg viewBox="${vb||"0 0 40 40"}" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const GOTA = '<path d="M20 5c6 9 10 14 10 20a10 10 0 0 1-20 0c0-6 4-11 10-20z"/>';
const DIBUJO = {
  llave: svg('<circle cx="12" cy="20" r="7"/><path d="M19 20h17M30 20v6M35 20v5"/>'),
  bateria: svg('<rect x="5" y="12" width="30" height="20" rx="2"/><path d="M11 12V8h5v4M24 12V8h5v4M10 22h6M24 22h6M27 19v6"/>'),
  piola: svg('<path d="M8 8h16M16 8v6"/><path d="M16 14c0 8 14 6 14 14s-10 6-10 6"/>'),
  apagado: svg('<path d="M20 5v14"/><path d="M11 10a13 13 0 1 0 18 0"/>'),
  saltos: svg('<path d="M4 22h6l3-9 5 16 3-9h4"/><path d="M29 22h7" stroke-dasharray="2 4"/>'),
  fuerza: svg('<path d="M5 29a15 15 0 0 1 30 0"/><path d="M20 29 11 21"/><circle cx="20" cy="29" r="2" fill="currentColor"/>'),
  acelerador: svg('<path d="M5 29a15 15 0 0 1 30 0"/><path d="M20 29 29 20"/><circle cx="20" cy="29" r="2" fill="currentColor"/>'),
  ruido: svg('<path d="M6 16h6l8-7v22l-8-7H6z"/><path d="M26 14a8 8 0 0 1 0 12M30 10a14 14 0 0 1 0 20"/>'),
  vibracion: svg('<path d="M4 20h5l3-9 5 18 5-18 5 18 3-9h6"/>'),
  humo: svg('<path d="M10 34c-4-5 4-8 0-13s4-8 0-13M20 34c-4-5 4-8 0-13s4-8 0-13M30 34c-4-5 4-8 0-13s4-8 0-13"/>'),
  "chorro-agua": svg('<path d="M5 11h11v7H5z"/><path d="M16 14c8 0 14 6 14 14"/><path d="M30 34v1M25 33v1M34 32v1"/>'),
  temperatura: svg('<path d="M17 6a3 3 0 0 1 6 0v18a7 7 0 1 1-6 0z"/><path d="M20 14v14"/>'),
  alarma: svg('<path d="M10 28V18a10 10 0 0 1 20 0v10l3 3H7z"/><path d="M17 34a3 3 0 0 0 6 0"/>'),
  helice: svg('<ellipse cx="20" cy="11" rx="4" ry="8"/><ellipse cx="20" cy="11" rx="4" ry="8" transform="rotate(120 20 20)"/><ellipse cx="20" cy="11" rx="4" ry="8" transform="rotate(240 20 20)"/>'),
  palanca: svg('<path d="M10 34h20"/><path d="M20 34 26 9"/><circle cx="26.5" cy="7" r="3"/>'),
  "aceite-cola": svg(GOTA + '<path d="M15 26h10"/>'),
  aceite: svg('<path d="M5 17h17l4 4 10-6-8 14H9z"/><path d="M12 17v-4h6v4"/>'),
  trim: svg('<path d="M13 6v28M7 12l6-6 6 6M27 34V6M21 28l6 6 6-6"/>'),
  nafta: svg('<path d="M9 10h16l6 6v18H9z"/><path d="M15 10V6h8M15 22h10"/>'),
  consumo: svg(GOTA + '<path d="M20 19v10M15 24l5 5 5-5"/>'),
  "motor-mojado": svg('<path d="M14 4h12l2 6v8h-4l-1 5h-6l-1-5h-4v-8z"/><path d="M3 30c4-3 7-3 11 0s7 3 11 0 7-3 11 0M3 36c4-3 7-3 11 0s7 3 11 0 7-3 11 0"/>'),
  golpe: svg('<path d="M20 4l3 9 9-4-4 9 9 3-9 3 4 9-9-4-3 9-3-9-9 4 4-9-9-3 9-3-4-9 9 4z"/>'),
  general: svg('<path d="M26 5a8 8 0 0 0-9 11L5 28l7 7 12-12a8 8 0 0 0 11-9l-5 5-5-1-1-5z"/>')
};
const ICON_TEL = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg>';
const ICON = {
  inicio:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/></svg>',
  mantenimiento:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M14.5 6.5a4 4 0 0 0-5.3 5.3L4 17l3 3 5.2-5.2a4 4 0 0 0 5.3-5.3l-2.4 2.4-2.4-.6-.6-2.4z"/></svg>',
  motor:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3h7l2 4v5h-3l-1 4h-2v5H9v-5H8z"/><path d="M11 21h5"/></svg>'
};

/* ---------- Navegación ---------- */
const RUTAS = ["inicio","diagnostico","ayuda","mantenimiento","motor"];
function ruta(){ const h = (location.hash||"").slice(1); if (!S.motor) return "motor"; return RUTAS.includes(h) ? h : "inicio"; }
function render(){
  const r = ruta();
  const p = S.motor ? pendientes() : 0;
  const pestana = (r === "diagnostico" || r === "ayuda") ? "inicio" : r;
  $("#tabs").innerHTML = [["inicio","Inicio"],["mantenimiento","Service"],["motor","Mi motor"]].map(([k,l]) =>
    `<a href="#${k}" ${pestana===k?'aria-current="page"':''}>${ICON[k]}${l}${k==="mantenimiento"&&p?`<span class="badge">${p}</span>`:""}</a>`).join("");
  $("#top").innerHTML = S.motor
    ? `<a class="motor" href="#motor"><small>Mi motor · ${esc(S.motor.tiempos)} · ${esc(S.motor.potencia)} HP</small><b>${esc(S.motor.marca)} ${esc(S.motor.modelo)}</b></a>
       <a class="ayuda-btn" href="#ayuda">${ICON_TEL}Pedir ayuda</a>`
    : `<span class="motor"><small>${esc(TALLER.nombre)}</small><b>Bienvenido</b></span>`;
  const v = $("#view");
  v.innerHTML = r === "motor" ? vMotor() : r === "mantenimiento" ? vMant() : r === "ayuda" ? vAyuda() : r === "diagnostico" ? vDiag() : vInicio();
  v.classList.remove("view"); void v.offsetWidth; v.classList.add("view");
}
window.addEventListener("hashchange", () => { diag = null; render(); scrollTo(0,0); });

/* ---------- Vista: inicio ---------- */
function vInicio(){
  const venc = pendientes();
  return `<div class="stack">
    <a class="sos-card" href="#diagnostico">
      ${svg('<path d="M24 5 44 41H4z"/><path d="M24 19v10M24 35v.5"/>', "0 0 48 48")}
      <b>Tengo un problema ahora</b><span>Le ayudo paso a paso</span>
    </a>
    <div class="accesos">
      <a href="#mantenimiento" class="${venc ? "alerta" : ""}">Service<small>${venc ? venc+(venc===1?" tarea vencida":" tareas vencidas") : "Todo al día"}</small></a>
      <a href="#motor">Mi motor<small>${Math.round(S.horas)} horas de uso</small></a>
    </div>
    <div class="consejo"><i>!</i><span>Antes de salir: chaleco para todos, remo, ancla y el celular cargado.</span></div>
  </div>`;
}

/* ---------- Seguridad y llamadas ---------- */
function bloqueSeguro(titulo){
  const av = D.AVISO_EMERGENCIA;
  const pasos = av ? av.pasos.filter(p => !/elija/i.test(p)) : ["Primero, todos con chaleco salvavidas.","Si la lancha va a la deriva hacia piedras o la costa, tire el ancla.","Si hay peligro, llame a Prefectura: 106 (o por radio, canal 16)."];
  return `<section class="seguro"><h2>${esc(titulo || (av && av.titulo) || "¿Está en el agua y con problemas?")}</h2>

/* ---------- Vista: diagnóstico ---------- */
function vDiag(){
  if (!diag){
    return `<div class="stack">
      <h1>¿Qué le pasa al motor?</h1>
      <p class="muted">Toque lo que le pasa. Le decimos qué hacer, paso a paso.</p>
      ${bloqueSeguro()}
      ${gruposDiag().map(([g, ds]) => `
      ${g ? `<div class="section-title"><h2>${esc(g)}</h2></div>` : ""}
      <div class="mosaico">${ds.map(d => `
        <button class="sintoma ${d.urgente ? "urgente" : ""}" data-a="sintoma" data-id="${d.id}">
          ${DIBUJO[d.icono] || DIBUJO.general}
          <span><b>${esc(d.titulo)}</b>${d.urgente ? `<br><span class="apague">Apague el motor</span>` : ""}</span>
        </button>`).join("")}</div>`).join("")}
      ${ficha() ? "" : `<div class="notice info">Su motor todavía no tiene ficha propia. Le mostramos el diagnóstico general para motores ${esc(S.motor.tiempos)}.</div>`}
    </div>`;
  }
  const d = diagnosticos().find(x => x.id === diag.id);
  const total = d.pasos.length, paso = d.pasos[diag.paso];
  const ladder = `<div class="ladder" aria-label="Paso ${diag.paso+1} de ${total}">${d.pasos.map((p,i)=>`<span class="${p.nivel==="mecanico"?"mec ":""}${i<diag.paso?"done":i===diag.paso?"now":""}"></span>`).join("")}</div>`;
  const head = `<button class="volver" data-a="${diag.paso>0 && !diag.fin ? "anterior" : "volver-sintomas"}">‹ ${diag.paso>0 && !diag.fin ? "Paso anterior" : "Volver"}</button>${ladder}`;
  const alerta = d.alerta && diag.paso === 0 ? `<div class="notice alto"><strong>Atención</strong><span>${esc(d.alerta)}</span></div>` : "";

  if (diag.fin === "resuelto"){
    return `<div class="stack">${head}
      <section class="bien"><span class="eyebrow">Se solucionó</span><h1>${esc(paso.solucion || "¡Bien! El motor anda")}</h1>
      <p>Si la falla vuelve, empiece otra vez desde este síntoma. Cuando vuelva a tierra, conviene que lo revise el taller.</p></section>
      <button class="btn ok big" data-a="guardar-diag">Guardar en el historial</button>
      <button class="link" data-a="volver-sintomas">Volver a la lista</button></div>`;
  }
  if (paso.nivel === "mecanico"){
    const res = resumen(d);
    if (!diag.contado){ diag.contado = true; contar("diag-mecanico/" + d.id); }
    return `<div class="stack">${head}
      <section class="stop"><span class="eyebrow">Hasta acá llega lo que puede hacer usted</span><h1>Pida ayuda. No siga probando.</h1></section>
      ${bloqueSeguro("Mientras tanto")}
      ${llamadas()}
      <a class="btn ok big" href="${esc(linkWhatsapp(res))}" target="_blank" rel="noopener" data-ev="whatsapp/diagnostico">Mandar al mecánico lo que ya probé</a>
      <details class="tecnico"><summary>Muéstrele esto al mecánico</summary>
        <ul>${paso.como.map(c=>`<li>${esc(c)}</li>`).join("")}</ul>
        <div class="resumen" id="resumen" style="margin-top:12px">${esc(res)}</div>
        <button class="btn sec full" style="margin-top:10px" data-a="copiar">Copiar resumen</button>
      </details>
      <button class="btn ghost" data-a="guardar-diag">Guardar en el historial</button></div>`;
  }
  return `<div class="stack paso">${head}
    <span class="eyebrow">Paso ${diag.paso+1} de ${total} · ${esc(d.titulo)}${paso.nivel==="intermedio" ? " · necesita herramientas" : ""}</span>
    ${alerta}
    <h1>${esc(paso.titulo)}</h1>
    <ol class="pasos-num">${paso.como.map(c=>`<li>${esc(c)}</li>`).join("")}</ol>
    ${paso.alto ? `<div class="notice alto"><strong>Cuidado</strong><span>${esc(paso.alto)}</span></div>` : ""}
    <div class="respuestas"><p>¿Se solucionó?</p>
      <button class="btn ok big" data-a="resuelto">Sí, se solucionó</button>
      <button class="btn big" data-a="siguiente">No, sigue igual</button>
    </div>
  </div>`;
}
function gruposDiag(){
  const ds = diagnosticos(), orden = (D.GRUPOS_DIAGNOSTICO || []).slice();
  ds.forEach(d => { if (d.grupo && !orden.includes(d.grupo)) orden.push(d.grupo); });
  const out = orden.map(g => [g, ds.filter(d => d.grupo === g)]).filter(x => x[1].length);
  const sueltos = ds.filter(d => !d.grupo);
  if (sueltos.length) out.push([out.length ? "Otros" : "", sueltos]);
  return out;
}
function resumen(d){
  const m = S.motor, hechos = d.pasos.slice(0, diag.paso).filter(p=>p.nivel!=="mecanico");
  return `Motor: ${m.marca} ${m.modelo} (${m.potencia} HP, ${m.tiempos}, año ${m.anio || "s/d"})
Horas de uso: ${Math.round(S.horas)}
Síntoma: ${d.titulo}
Revisado por el dueño:
${hechos.map(p=>"- "+p.titulo).join("\n") || "- (nada todavía)"}
Fecha: ${fmtFecha(hoy())}`;
}

function tareaHTML(t, e){
  const open = abierta === t.id, reg = registrando === t.id;
  const u = ultimo(t.id);
  const cc = t.cada || {};
  const freq = (cc.horas || cc.meses) ? `Cada ${[cc.horas?cc.horas+" h":"", cc.meses?cc.meses+" meses":""].filter(Boolean).join(" o ")}${cc.primeraHoras?` · motor 0 horas: primera a las ${cc.primeraHoras} h`:""}` : t.temporada ? (t.temporada==="inicio"?"Inicio de temporada":"Fin de temporada") : "Cada uso";
  return `<div class="tarea">
    <button data-a="tarea" data-id="${t.id}" aria-expanded="${open}"><span class="t"><h3>${esc(t.nombre)}</h3><small>${esc(e.txt)}</small></span><span class="chip ${e.k}">${nombreEstado[e.k]}</span></button>
    ${open ? `<div class="det">
      <p>${esc(t.porque)}</p>${t.notaMarca?`<p class="notice info">${esc(t.notaMarca)}</p>`:""}${cc.primeraHoras?`<p class="muted" style="font-size:.9rem">La primera revisión (a las ${cc.primeraHoras} h) es solo para motores nuevos, 0 horas. En un motor usado, siga el intervalo normal.</p>`:""}
      <div class="row"><span class="chip info">${esc(freq)}</span>${t.segun?`<span class="chip aldia">Según ${esc(t.segun)}</span>`:(t.cada&&!t.cada.usos?`<span class="chip proxima">Intervalo general</span>`:"")}${t.quien==="mecanico"?`<span class="chip mecanico">Tarea de taller</span>`:`<span class="chip simple">La puede hacer usted</span>`}</div>
      <ol>${t.pasos.map(p=>`<li>${esc(p)}</li>`).join("")}</ol>
      ${t.materiales && t.materiales.length ? `<p><strong>Materiales:</strong> ${t.materiales.map(esc).join(", ")}</p>` : ""}
      ${["vencida","proxima","sinregistro"].includes(e.k) ? `<a class="btn ok" href="${esc(linkWhatsapp(textoTurno([t])))}" target="_blank" rel="noopener" data-ev="turno/${esc(t.id)}">${t.quien==="mecanico" ? "Pedir turno al taller" : "Prefiero que lo haga el taller: pedir turno"}</a>` : ""}
      ${u ? `<p class="muted" style="font-size:.9rem">Último registro: ${esc(fmtFecha(u.fecha))}${u.horas!=null?` a las ${Math.round(u.horas)} h`:""}.</p>` : ""}
      ${reg ? `<form class="stack" id="f-reg" data-id="${t.id}">
          <div class="grid2"><div class="field"><label for="r-fecha">Fecha</label><input id="r-fecha" type="date" value="${hoy()}" required></div>
          <div class="field"><label for="r-horas">Horas</label><input id="r-horas" type="number" inputmode="decimal" min="0" step="0.5" value="${S.horas}"></div></div>

        </form>` : `<button class="btn sec" data-a="registrar" data-id="${t.id}">Registrar como hecha</button>`}
    </div>` : ""}
  </div>`;
}

/* ---------- Acciones ---------- */
function toast(t){ const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(()=> el.hidden = true, 2200); }
async function copiar(texto, el){
  try { await navigator.clipboard.writeText(texto); toast("Copiado"); }
  catch(e){ if (el){ const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); if (el.select) el.select(); } toast("Seleccionado: mantenga apretado para copiar"); }
}
document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-a]"); if (!b) return;
  const a = b.dataset.a;
  if (a === "sintoma"){ diag = { id:b.dataset.id, paso:0 }; render(); scrollTo(0,0); }
  else if (a === "volver-sintomas"){ diag = null; render(); }
  else if (a === "siguiente"){ diag.paso++; render(); scrollTo(0,0); }
  else if (a === "anterior"){ diag.paso--; render(); scrollTo(0,0); }
  else if (a === "resuelto"){ diag.fin = "resuelto"; render(); }
  else if (a === "guardar-diag"){
    const d = diagnosticos().find(x=>x.id===diag.id), p = d.pasos[diag.paso];
    S.registros.push({ tipo:"diagnostico", tarea:"diag-"+d.id, titulo:d.titulo, fecha:hoy(), horas:S.horas, nota: diag.fin==="resuelto" ? "Resuelto en: "+p.titulo : "Derivado al mecánico" });
    save(); diag = null; toast("Guardado en el historial"); render();
  }
  else if (a === "copiar"){ copiar($("#resumen").textContent, $("#resumen")); }
  else if (a === "copiar-bk"){ copiar(JSON.stringify(S), $("#bk")); }
  else if (a === "restaurar"){
    try { const s = JSON.parse($("#rest").value); if (!s.motor) throw 0; S = s; save(); toast("Datos restaurados"); render(); }
    catch(e){ toast("El texto no es una copia válida. Pegue el texto completo."); }
  }
  else if (a === "tarea"){ abierta = abierta === b.dataset.id ? null : b.dataset.id; registrando = null; render(); }
  else if (a === "registrar"){ registrando = b.dataset.id; render(); }
  else if (a === "cancelar-reg"){ registrando = null; render(); }
  else if (a === "ir-horas"){ location.hash = "mantenimiento"; setTimeout(()=>{ const i = $("#in-horas"); if (i){ i.focus(); i.select(); } }, 50); }
  else if (a === "avisos"){
    try {
      if (!("Notification" in window)) throw 0;
      Notification.requestPermission().then(p => toast(p === "granted" ? "Avisos activados" : "El celular no permitió los avisos"));
    } catch(e){ toast("Los avisos funcionan con la app instalada en el celular"); }
  }
});
document.addEventListener("submit", ev => {
  ev.preventDefault();
  const f = ev.target;
  if (f.id === "f-horas"){ const h = parseFloat($("#in-horas").value); if (h >= 0){ S.horas = h; save(); toast("Horas actualizadas"); render(); } }
  else if (f.id === "f-reg"){
    S.registros.push({ tipo:"tarea", tarea:f.dataset.id, fecha:$("#r-fecha").value || hoy(), horas: parseFloat($("#r-horas").value) || 0, nota:$("#r-nota").value.trim() });
    const h = parseFloat($("#r-horas").value); if (h > S.horas) S.horas = h;
    registrando = null; save(); toast("Tarea registrada"); render();
  }
  else if (f.id === "f-motor"){
    const nuevo = !S.motor;
    S.motor = {
      catalogoId: $("#m-cat").value || null,
      marca: $("#m-marca").value.trim(), modelo: $("#m-modelo").value.trim(),
      potencia: parseFloat($("#m-pot").value), anio: parseInt($("#m-anio").value,10) || null,
      tiempos: f.querySelector('[name="tiempos"]:checked').value,
      alimentacion: f.querySelector('[name="alim"]:checked').value,
      uso: (f.querySelector('[name="uso"]:checked') || {}).value || "recreativo"
    };
    if (nuevo) S.horas = parseFloat(($("#m-horas")||{}).value) || 0;
    save(); toast(nuevo ? "Motor configurado" : "Cambios guardados");
    contar("motor/" + [S.motor.marca, S.motor.modelo, S.motor.modelo.includes(S.motor.tiempos) ? "" : S.motor.tiempos].filter(Boolean).join(" "));
    if (nuevo) location.hash = "inicio"; else render();
  }
});
document.addEventListener("change", ev => {
  if (ev.target.id !== "m-cat") return;
  const x = D.MOTORES.find(m => m.id === ev.target.value); if (!x) return;
  $("#m-marca").value = x.marca; $("#m-modelo").value = x.modelo; $("#m-pot").value = x.potencia;
  $(x.tiempos === "4T" ? "#t4" : "#t2").checked = true;
  $(x.alimentacion === "inyeccion" ? "#a2" : "#a1").checked = true;
});

/* ---------- Arranque ---------- */
// Primera vez: dejamos preseleccionado el motor de ejemplo para que se vea cómo funciona.
render();
if (!S.motor){ const sel = $("#m-cat"); if (sel && D.MOTORES[0]){ sel.value = D.MOTORES[0].id; sel.dispatchEvent(new Event("change", { bubbles:true })); } }
// Aviso de tareas vencidas al abrir la app (una vez por día)
try {
  if (S.motor && "Notification" in window && Notification.permission === "granted"){
    const n = pendientes(), k = KEY+"-aviso";
    if (n && localStorage.getItem(k) !== hoy()){ new Notification("Mantenimiento de su motor", { body: n+" tarea(s) vencida(s). Ábrala para ver el detalle.", icon:"icono.svg" }); localStorage.setItem(k, hoy()); }
  }
} catch(e){}
// Estadísticas: una apertura más (y manda lo que quedó pendiente sin señal)
contar("abrir/" + modoApp());
// Instalación como app (funciona cuando se publica en un sitio propio)
try { if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(()=>{}); } catch(e){}
})();
</script>
<script>
/* Botón "Instalar la app". Android/Chrome: instala con un toque. iPhone y otros: muestra los pasos con dibujos. */
(function(){
  "use strict";
  var KEY = "fdb-instalar-no";
  var banda = document.getElementById("inst"), hoja = document.getElementById("inst-hoja"), pasos = document.getElementById("inst-pasos");
  var aviso = null;
  function guardar(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
  function leer(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
  var instalada = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
  var enMarco = false; try { enMarco = window.top !== window; } catch(e){ enMarco = true; }
  if (instalada || enMarco || location.protocol !== "https:") return;
  var ua = navigator.userAgent || "";
  var ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var android = /Android/.test(ua);
  var nuevoNo = Number(leer(KEY) || 0);
  function mostrar(){ if (Date.now() - nuevoNo > 3*24*3600*1000) banda.hidden = false; }
  var COMP = '<span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3m-4 4l4-4 4 4"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg></span>';
  var MAS = '<span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 8v8M8 12h8"/></svg></span>';
  var PUNTOS = '<span class="ico"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></span>';
  function abrirPasos(){
    if (ios) {
      pasos.innerHTML = (/CriOS|FxiOS|EdgiOS/.test(ua) ? '<p class="flecha">Si no ve estas opciones, abra este link en Safari.</p>' : '') +
        '<ol><li><span>Toque el botón <b>Compartir</b> ' + COMP + ' (abajo, en el centro de la pantalla; o arriba en el iPad).</span></li>' +
        '<li><span>Baje un poco y toque <b>Agregar a inicio</b> ' + MAS + '</span></li>' +
        '<li><span>Toque <b>Agregar</b>, arriba a la derecha. Listo: la app queda en la pantalla del celular.</span></li></ol>';
    } else {
      pasos.innerHTML = '<ol><li><span>Toque los <b>tres puntos</b> ' + PUNTOS + ' arriba a la derecha (o el menú ☰ abajo).</span></li>' +
        '<li><span>Toque <b>Instalar app</b> o <b>Agregar a pantalla principal</b>.</span></li>' +
        '<li><span>Toque <b>Instalar</b> o <b>Agregar</b>. Listo: la app queda en la pantalla del celular.</span></li></ol>';
    }
    hoja.hidden = false;
    document.getElementById("inst-ok").focus();
  }
  window.addEventListener("beforeinstallprompt", function(e){ e.preventDefault(); aviso = e; mostrar(); });
  window.addEventListener("appinstalled", function(){ banda.hidden = true; hoja.hidden = true; aviso = null; });
  document.getElementById("inst-si").addEventListener("click", function(){
    if (aviso) {
      var a = aviso; aviso = null;
      a.prompt();
      a.userChoice.then(function(r){ if (r && r.outcome === "accepted") banda.hidden = true; }).catch(function(){});
    } else abrirPasos();
  });
  document.getElementById("inst-no").addEventListener("click", function(){ banda.hidden = true; guardar(KEY, String(Date.now())); });
  document.getElementById("inst-ok").addEventListener("click", function(){ hoja.hidden = true; });
  hoja.addEventListener("click", function(e){ if (e.target === hoja) hoja.hidden = true; });
  /* iPhone nunca avisa: se muestra siempre. Android: si en 3 s Chrome no ofreció instalar (otro navegador), se muestra con los pasos. */
  if (ios) mostrar(); else if (android) setTimeout(function(){ mostrar(); }, 3000);
})();
</script>
